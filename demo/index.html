<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nails&amp;Gel · Book an appointment</title>
<meta name="description" content="Book at Nails&amp;Gel, luxury nail bar &amp; spa and Korean hard-gel specialists in Melbourne CBD since 2017.">
<meta name="theme-color" content="#F5ECE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161111" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">

<body>
<!--BODY-->
<button type="button" class="skip" data-skip>Skip to booking</button>
<div class="maison">

    <p class="addr-top">Level 1 · 179 Little Bourke St</p>
    <p class="wordmark">Nails<span class="amp">&amp;</span>Gel</p>

  </div>

    <span class="fw">Nails<i>&amp;</i>Gel</span>
